<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- 3D Kavis ve Işık (Globe) -->
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a4a4d" />
      <stop offset="35%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Parlama Efekti -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Arka Plan (Opsiyonel şeffaf, koyu modda görünmesi için hafif ışıklar eklenebilir) -->
  
  <!-- Yıldızlar -->
  <circle cx="20" cy="30" r="1.5" fill="#fff" opacity="0.8" filter="url(#glow)" />
  <circle cx="85" cy="25" r="2" fill="#fff" opacity="0.6" filter="url(#glow)" />
  <circle cx="105" cy="80" r="1.5" fill="#fff" opacity="0.9" filter="url(#glow)" />
  <circle cx="25" cy="95" r="2" fill="#fff" opacity="0.5" filter="url(#glow)" />
  <circle cx="60" cy="10" r="1" fill="#fff" opacity="0.7" filter="url(#glow)" />
  <circle cx="10" cy="70" r="1.2" fill="#fff" opacity="0.4" filter="url(#glow)" />
  
  <!-- Siyah 3D Küre -->
  <!-- İç gölgeyi simüle etmek için siyah zemin üzerine radyal gradient -->
  <circle cx="60" cy="60" r="46" fill="#000" />
  <circle cx="60" cy="60" r="46" fill="url(#globeGrad)" />

  <!-- Kırmızı Yörünge Halkası -->
  <!-- Transform ile -20 derece eğimli -->
  <g transform="rotate(-20 60 60)">
    <ellipse cx="60" cy="60" rx="55" ry="20" fill="none" stroke="rgba(220, 30, 50, 0.9)" stroke-width="1.5" />
    
    <!-- Yörünge Üzerindeki Beyaz Gezegenler/Uydular -->
    <circle cx="60" cy="40" r="3" fill="#fff" filter="url(#glow)" />
    <circle cx="115" cy="60" r="2.5" fill="#fff" filter="url(#glow)" />
    <circle cx="5" cy="60" r="2" fill="#fff" filter="url(#glow)" />
  </g>
</svg>